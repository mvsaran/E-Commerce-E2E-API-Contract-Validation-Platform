<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Review your shopping cart on ShopSphere" />
  <title>Cart — ShopSphere</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="page-wrapper">

  <!-- Navigation -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container navbar-inner">
      <a href="/products.html" class="navbar-brand" aria-label="ShopSphere home">
        <div class="brand-icon" aria-hidden="true">🛍</div>
        ShopSphere
      </a>
      <ul class="navbar-nav" role="list">
        <li><a href="/products.html" id="nav-products">🏪 Products</a></li>
        <li>
          <a href="/cart.html" class="active" id="nav-cart" aria-current="page">
            🛒 Cart
            <span class="cart-badge cart-count" id="cart-count" style="display:none">0</span>
          </a>
        </li>
        <li><a href="/order-confirmation.html" id="nav-orders">📦 Orders</a></li>
      </ul>
      <div class="navbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" role="main">
    <div class="container">

      <!-- Page Header -->
      <div class="section-header">
        <h1 class="section-title">Shopping Cart</h1>
        <span id="item-count-label" style="font-size:0.875rem;color:var(--color-text-muted)"></span>
      </div>

      <!-- Alert area -->
      <div id="alert-container" role="alert" aria-live="polite"></div>

      <!-- Loading state -->
      <div id="loading-state" class="text-center" style="padding:3rem 0" aria-label="Loading cart">
        <span class="spinner"></span>
        <p class="mt-md text-muted">Loading your cart…</p>
      </div>

      <!-- Cart Layout (hidden until loaded) -->
      <div class="cart-layout hidden" id="cart-layout">

        <!-- Cart Items -->
        <div class="glass-card" id="cart-items-card" role="region" aria-label="Cart items">
          <div class="card-header">
            <h2 style="font-size:1rem; font-weight:600;">Items</h2>
          </div>
          <div id="cart-items-list" role="list">
            <!-- Rendered by cart.js -->
          </div>
          <div class="empty-cart hidden" id="empty-cart">
            <div class="empty-icon" aria-hidden="true">🛒</div>
            <h3 style="font-size:1rem; margin-bottom:0.5rem;">Your cart is empty</h3>
            <p class="text-muted" style="font-size:0.875rem;">Add some products to get started</p>
            <a href="/products.html" class="btn btn-primary mt-md">Browse Products</a>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="cart-summary glass-card" role="region" aria-label="Order summary">
          <div class="card-header">
            <h2 style="font-size:1rem; font-weight:600;">Order Summary</h2>
          </div>
          <div class="card-body">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="summary-subtotal">$0.00</span>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span class="text-success">Free</span>
            </div>
            <div class="summary-row">
              <span>Tax (8%)</span>
              <span id="summary-tax">$0.00</span>
            </div>
            <div class="summary-total">
              <span>Total</span>
              <span id="summary-total">$0.00</span>
            </div>

            <a
              href="/checkout.html"
              class="btn btn-primary btn-lg btn-full mt-md"
              id="checkout-btn"
              data-testid="checkout-btn"
              role="button"
            >
              Proceed to Checkout →
            </a>

            <a
              href="/products.html"
              class="btn btn-secondary btn-full mt-sm"
              id="continue-shopping-btn"
            >
              Continue Shopping
            </a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="toast-container" role="status" aria-live="polite"></div>

  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
