name: E2E + API Contract Validation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  BASE_URL: 'http://localhost:3000'
  TEST_EMAIL: 'admin@test.com'
  TEST_PASSWORD: 'password123'
  JWT_SECRET: 'ecommerce-super-secret-jwt-key-2024'
  CI: 'true'

jobs:
  playwright-tests:
    name: Playwright E2E + API Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js Setup ──────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ── Install Dependencies ───────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Install Playwright Browsers ────────────────────────────
      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      # ── Install Allure CLI ─────────────────────────────────────
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # ── TypeScript Check ───────────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── Run Playwright Tests ───────────────────────────────────
      # Global setup auto-starts the Express backend.
      # All 6 scenarios run in sequence (workers: 1).
      - name: Run Playwright tests (all 6 scenarios)
        run: npx playwright test
        continue-on-error: false

      # ── Generate Allure Report ─────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      # ── Upload Playwright Report ───────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # ── Upload Allure Report ───────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ── Upload Test Artifacts (traces, screenshots, videos) ────
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  newman-collection:
    name: Postman Collection (Newman)
    runs-on: ubuntu-latest
    needs: playwright-tests
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── Start backend server ───────────────────────────────────
      - name: Start Express backend
        run: |
          npx ts-node backend/server.ts &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/health && break || sleep 1
          done

      # ── Run Newman (Postman Collection) ────────────────────────
      - name: Run Postman Collection via Newman
        run: |
          npm run postman:run

      # ── Upload Newman results ──────────────────────────────────
      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: test-results/newman-results.json
          retention-days: 30
